{{define "modals/clientsModal"}}
<a-modal
    id="client-modal"
    v-model="clientModal.visible"
    :title="clientModal.title"
    @ok="clientModal.ok"
    :confirm-loading="clientModal.confirmLoading"
    :closable="true"
    :mask-closable="false"
    :class="themeSwitcher.currentTheme"
    :ok-text="clientModal.okText"
    cancel-text='{{ i18n "close" }}'
>
    <template v-if="isEdit">
        <a-tag
            v-if="isExpiry || isTrafficExhausted"
            color="red"
            :style="{ marginBottom: '10px', display: 'block', textAlign: 'center' }"
            >Account is (Expired|Traffic Ended) And Disabled</a-tag
        >
    </template>
    {{template "form/client"}}
</a-modal>
<script>
    // The protocols whose accounts must not be spread over two inbounds. Mirrors
    // sameProtocolAmbiguous() in web/service/account.go: all three authenticate
    // through one shared daemon that does not name the inbound, so the account
    // would always be served by whichever has the lower id, silently. The server
    // refuses the save; this list is only what stops the operator ticking it.
    const SHARED_DAEMON_PROTOCOLS = [Protocols.L2TP, Protocols.PPTP, Protocols.IKEV2];

    // The inbound-membership checklist's state, rebuilt every time the modal opens.
    //
    // Its methods reach the state through clientModal rather than `this`: they are
    // handed to the template as bare event handlers (@change="membershipPicker
    // .toggleAll"), which arrive with no receiver. Same reason adminModal's do.
    function buildClientMembership(dbInbound, client) {
        const currentId = dbInbound ? dbInbound.id : 0;
        // Only inbounds that can hold an account at all. An inbound with no client
        // list (dokodemo-door, socks/http, single-user shadowsocks) has nothing to
        // be a member of, and the list is already scoped to what this admin or
        // reseller may see, which is the same set the server checks ownership
        // against.
        const options = (app.dbInbounds || [])
            .filter((row) => Array.isArray(app.getInboundClients(row)))
            .map((row) => ({
                id: row.id,
                remark: row.remark,
                protocol: row.protocol,
                port: row.port,
            }));
        const offered = options.map((ib) => ib.id);
        // An account's current memberships are already on this page: the projection
        // writes the account into settings.clients on every inbound serving it, so
        // "the same email elsewhere" IS the membership set. A new account has none
        // yet and starts on the inbound the form was opened from.
        const selected = app
            .clientInbounds(client ? client.email : "")
            .map((ib) => ib.id)
            .filter((id) => offered.includes(id));
        if (currentId && !selected.includes(currentId)) {
            selected.push(currentId);
        }
        return {
            // One inbound is not a choice, so the whole block stays hidden.
            available: options.length > 1,
            currentId,
            options,
            selected,
            // The largest set that can actually be served: everything on offer,
            // minus a second inbound of any shared-daemon protocol. The inbound
            // the form was opened from claims its protocol's single place, since
            // it is a member whatever else is ticked.
            maxSet() {
                const m = clientModal.membership;
                const taken = {};
                const out = [];
                m.options.forEach((ib) => {
                    if (ib.id !== m.currentId) return;
                    taken[ib.protocol] = true;
                    out.push(ib.id);
                });
                m.options.forEach((ib) => {
                    if (out.includes(ib.id)) return;
                    if (SHARED_DAEMON_PROTOCOLS.includes(ib.protocol)) {
                        if (taken[ib.protocol]) return;
                        taken[ib.protocol] = true;
                    }
                    out.push(ib.id);
                });
                return out;
            },
            // Two reasons a row cannot be ticked: it is the inbound this form was
            // opened from (the server puts the account there whatever the form
            // says), or it would be a second inbound of a shared-daemon protocol.
            // Blocked before the click rather than refused after it, because a
            // rejected tick has no honest way back: the checkbox is controlled, so
            // leaving the model alone leaves the box looking ticked.
            isLocked(ib) {
                const m = clientModal.membership;
                if (ib.id === m.currentId) return true;
                if (!SHARED_DAEMON_PROTOCOLS.includes(ib.protocol)) return false;
                if (m.selected.includes(ib.id)) return false;
                return m.options.some(
                    (other) =>
                        other.protocol === ib.protocol &&
                        other.id !== ib.id &&
                        m.selected.includes(other.id),
                );
            },
            get hasProtocolClash() {
                const m = clientModal.membership;
                return m.options.some((ib) => ib.id !== m.currentId && m.isLocked(ib));
            },
            // "All" means every inbound that can be served, not every inbound
            // listed: with a second l2tp on the page the full list is unreachable,
            // and a select-all that can never read as checked is a broken control.
            get allChecked() {
                const m = clientModal.membership;
                const max = m.maxSet();
                return max.length > 0 && max.every((id) => m.selected.includes(id));
            },
            get someChecked() {
                const m = clientModal.membership;
                return m.selected.length > 0 && !m.allChecked;
            },
            toggleAll(e) {
                const m = clientModal.membership;
                m.selected = e.target.checked
                    ? m.maxSet()
                    : [m.currentId].filter(Boolean);
            },
            change(ids) {
                const m = clientModal.membership;
                const next = (ids || []).slice();
                if (m.currentId && !next.includes(m.currentId)) {
                    next.push(m.currentId);
                }
                m.selected = next;
            },
        };
    }

    const clientModal = {
        visible: false,
        confirmLoading: false,
        title: "",
        okText: "",
        isEdit: false,
        dbInbound: new DBInbound(),
        inbound: new Inbound(),
        clients: [],
        clientStats: [],
        oldClientId: "",
        index: null,
        clientIps: null,
        delayedStart: false,
        // Replaced wholesale by show(). Declared here so Vue observes the key and
        // the checklist below it stays reactive when a later open swaps the object.
        membership: {
            available: false,
            currentId: 0,
            options: [],
            selected: [],
        },
        ok() {
            if (clientModal.isEdit) {
                ObjectUtil.execute(
                    clientModal.confirm,
                    clientModalApp.client,
                    clientModal.dbInbound.id,
                    clientModal.oldClientId,
                );
            } else {
                ObjectUtil.execute(
                    clientModal.confirm,
                    clientModalApp.client,
                    clientModal.dbInbound.id,
                );
            }
        },
        show({
            title = "",
            okText = '{{ i18n "sure" }}',
            index = null,
            dbInbound = null,
            confirm = () => {},
            isEdit = false,
        }) {
            this.visible = true;
            this.title = title;
            this.okText = okText;
            this.isEdit = isEdit;
            this.dbInbound = new DBInbound(dbInbound);
            this.inbound = Inbound.fromJson(dbInbound.toInbound().toJson());
            this.clients = this.inbound.clients;
            this.index = index === null ? this.clients.length : index;
            this.delayedStart = false;
            if (isEdit) {
                if (this.clients[index].expiryTime < 0) {
                    this.delayedStart = true;
                }
                this.oldClientId = this.getClientId(
                    dbInbound.protocol,
                    clients[index],
                );
            } else {
                this.addClient(this.inbound, this.clients);
                this.seedResellerQuota(this.clients[this.index]);
            }
            this.clientStats = this.dbInbound.clientStats.find(
                (row) => row.email === this.clients[this.index].email,
            );
            this.membership = buildClientMembership(
                this.dbInbound,
                this.clients[this.index],
            );
            this.confirm = confirm;
        },
        // What the form has to say about memberships, in the shape the write path
        // posts.
        //
        // null means "say nothing", which is what every caller did before the
        // checklist existed: an absent inboundIds field is read server-side as an
        // ordinary single-inbound write (postedMembershipIds), so the bulk-add path
        // and any script against the API keep their exact behaviour. Only a form
        // that actually SHOWED the checklist names a set.
        postedInboundIds() {
            const m = clientModal.membership;
            if (!m || !m.available) return null;
            // The checklist is hidden until the account has an email, since that is
            // what a membership is keyed on (and what the server keys it on too), so
            // a form that never showed it must not speak for it.
            const client = clientModalApp.client;
            if (!client || !client.email) return null;
            const ids = (m.selected || []).slice();
            // The empty-string sentinel is how a cleared checkbox group is posted
            // (the same convention admin_modal.html uses); the server skips the
            // blank and keeps the target inbound. Unreachable while the current
            // inbound is locked on, and kept so it stays that way if it is not.
            return ids.length ? ids : [""];
        },
        // Single definition in model/inbound.js, mirrored by clientIdentityKey() in
        // web/service/inbound.go. Do not inline the switch here again.
        getClientId(protocol, client) {
            return getClientIdentity(protocol, client);
        },
        // A new account starts at totalGB 0, which means UNLIMITED, and a reseller
        // selling out of a limited balance may not create one of those. The form's
        // :min shows their floor but ant only clamps the MODEL on interaction, so an
        // untouched field left the quota at 0 while displaying 1: the save was
        // refused, and the derived duration beside it read 0 days because the days
        // are a function of the gigabytes.
        //
        // Seeding the model, rather than the input, is what makes the two agree.
        seedResellerQuota(client) {
            if (!client || !RESELLER.isReseller || RESELLER.unlimited) return;
            if (client.totalGB > 0) return;
            const floorGb = Math.max(1, Number(RESELLER.minCreateGb) || 0);
            client.totalGB = floorGb * SizeFormatter.ONE_GB;
        },
        addClient(inbound, clients) {
            switch (inbound.protocol) {
                case Protocols.VMESS:
                    return clients.push(new Inbound.VmessSettings.VMESS());
                case Protocols.VLESS:
                    return clients.push(new Inbound.VLESSSettings.VLESS());
                case Protocols.TROJAN:
                    return clients.push(new Inbound.TrojanSettings.Trojan());
                case Protocols.SHADOWSOCKS:
                    return clients.push(
                        new Inbound.ShadowsocksSettings.Shadowsocks(
                            clients[0].method,
                            RandomUtil.randomShadowsocksPassword(
                                inbound.settings.method,
                            ),
                        ),
                    );
                case Protocols.L2TP:
                    return clients.push(new Inbound.L2tpSettings.L2tpUser());
                case Protocols.PPTP:
                    return clients.push(new Inbound.PptpSettings.PptpUser());
                case Protocols.OPENVPN:
                    return clients.push(
                        new Inbound.OpenvpnSettings.OpenvpnUser(),
                    );
                case Protocols.OPENCONNECT:
                    return clients.push(
                        new Inbound.OcservSettings.OcservUser(),
                    );
                case Protocols.SSTP:
                    return clients.push(
                        new Inbound.SstpSettings.SstpUser(),
                    );
                case Protocols.IKEV2:
                    return clients.push(
                        new Inbound.Ikev2Settings.Ikev2User(),
                    );
                case Protocols.WGC:
                    return clients.push(
                        new Inbound.WgcSettings.WgUser(),
                    );
                case Protocols.AWG:
                    return clients.push(
                        new Inbound.AwgSettings.AwgUser(),
                    );
                case Protocols.GRE:
                    return clients.push(
                        new Inbound.GreSettings.GreUser(),
                    );
                case Protocols.MTPROTO:
                    return clients.push(
                        new Inbound.MtprotoSettings.MtprotoUser(),
                    );
                case Protocols.SSH:
                    return clients.push(
                        new Inbound.SshSettings.SshUser(),
                    );
                case Protocols.HYSTERIA:
                    return clients.push(
                        new Inbound.HysteriaSettings.Hysteria(),
                    );
                case Protocols.ANYTLS:
                    return clients.push(
                        new Inbound.AnytlsSettings.Anytls(),
                    );
                case Protocols.TUIC:
                    return clients.push(
                        new Inbound.TuicSettings.Tuic(),
                    );
                case Protocols.NAIVE:
                    return clients.push(
                        new Inbound.NaiveSettings.Naive(),
                    );
                default:
                    return null;
            }
        },
        close() {
            clientModal.visible = false;
            clientModal.loading(false);
        },
        loading(loading = true) {
            clientModal.confirmLoading = loading;
        },
    };

    const clientModalApp = new Vue({
        delimiters: ["[[", "]]"],
        el: "#client-modal",
        data: {
            clientModal,
            get inbound() {
                return this.clientModal.inbound;
            },
            get client() {
                return this.clientModal.clients[this.clientModal.index];
            },
            get clientStats() {
                return this.clientModal.clientStats;
            },
            get isEdit() {
                return this.clientModal.isEdit;
            },
            // The inbound-membership checklist in form/client. Read by name there,
            // and defined again in modals/inbound_modal.html, which renders the
            // same form for an inbound that does not exist yet.
            get membershipPicker() {
                return this.clientModal.membership;
            },
            get datepicker() {
                return app.datepicker;
            },
            get isTrafficExhausted() {
                if (!this.clientStats) return false;
                if (this.clientStats.total <= 0) return false;
                if (this.clientStats.up + this.clientStats.down < this.clientStats.total)
                    return false;
                return true;
            },
            get isExpiry() {
                return this.clientModal.isEdit && this.client.expiryTime > 0
                    ? this.client.expiryTime < new Date().getTime()
                    : false;
            },
            get delayedStart() {
                return this.clientModal.delayedStart;
            },
            set delayedStart(value) {
                this.clientModal.delayedStart = value;
            },
            get delayedExpireDays() {
                return this.client && this.client.expiryTime < 0
                    ? this.client.expiryTime / -86400000
                    : 0;
            },
            set delayedExpireDays(days) {
                this.client.expiryTime = -86400000 * days;
            },
            // Whether this account's duration is a function of its traffic
            // rather than something the operator picks. True only for a reseller
            // on a days-per-GB plan, in which case the backend overwrites any
            // posted expiry and the form hides the controls entirely.
            get resellerForcedDays() {
                return !!(RESELLER.isReseller && RESELLER.daysPerGb > 0);
            },
            // The derived duration, shown in place of the controls so the
            // reseller can see what they are selling before they save.
            get resellerForcedDaysText() {
                const gb = this.client && this.client.totalGB > 0
                    ? this.client.totalGB / SizeFormatter.ONE_GB
                    : 0;
                const days = NumberFormatter.toFixed(gb * RESELLER.daysPerGb, 1);
                return days + ' ' + '{{ i18n "pages.client.expireDays" }}';
            },
        },
        methods: {
            async getDBClientIps(email) {
                const msg = await HttpUtil.post(
                    `/panel/api/inbounds/clientIps/${email}`,
                );
                if (!msg.success) {
                    document.getElementById("clientIPs").value = msg.obj;
                    return;
                }
                let ips = msg.obj;
                if (
                    typeof ips === "string" &&
                    ips.startsWith("[") &&
                    ips.endsWith("]")
                ) {
                    try {
                        ips = JSON.parse(ips);
                        ips = Array.isArray(ips) ? ips.join("\n") : ips;
                    } catch (e) {
                        console.error("Error parsing JSON:", e);
                    }
                }
                document.getElementById("clientIPs").value = ips;
            },
            async clearDBClientIps(email) {
                try {
                    const msg = await HttpUtil.post(
                        `/panel/api/inbounds/clearClientIps/${email}`,
                    );
                    if (!msg.success) {
                        return;
                    }
                    document.getElementById("clientIPs").value = "";
                } catch (error) {}
            },
            resetClientTraffic(email, dbInboundId, iconElement) {
                this.$confirm({
                    title: '{{ i18n "pages.inbounds.resetTraffic"}}',
                    content: '{{ i18n "pages.inbounds.resetTrafficContent"}}',
                    class: themeSwitcher.currentTheme,
                    okText: '{{ i18n "reset"}}',
                    cancelText: '{{ i18n "cancel"}}',
                    onOk: async () => {
                        iconElement.disabled = true;
                        const msg = await HttpUtil.postWithModal(
                            "/panel/api/inbounds/" +
                                dbInboundId +
                                "/resetClientTraffic/" +
                                email,
                        );
                        if (msg.success) {
                            this.clientModal.clientStats.up = 0;
                            this.clientModal.clientStats.down = 0;
                        }
                        iconElement.disabled = false;
                    },
                });
            },
        },
    });
</script>
{{end}}
